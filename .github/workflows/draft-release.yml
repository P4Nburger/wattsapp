# main に push されたとき、プロジェクトのバージョン（MARKETING_VERSION）の
# リリースがまだなければ、下書きのリリースを作る。
# 本文は .github/release-notes/v<バージョン>.md から読む。
# 作られた下書きに WattsApp.zip を添付して公開すればリリース完了。
name: Draft release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(grep -m1 -oE 'MARKETING_VERSION = [0-9.]+' wattsapp.xcodeproj/project.pbxproj | awk '{print $3}')
          if [ -z "$version" ]; then
            echo "::error::MARKETING_VERSION not found"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 下書きも含めて、同じタグのリリースがあれば何もしない
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            echo "Release $TAG already exists. Nothing to do."
            exit 0
          fi

          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::$notes not found. Skipping draft release for $TAG."
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --title "WattsApp $TAG" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA"
          echo "Created draft release $TAG. Attach WattsApp.zip and publish it."
